<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond dégradé BNI -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d2d5f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Corps du calendrier -->
  <rect x="10" y="16" width="44" height="40" rx="5" fill="#ffffff"/>
  <!-- En-tête rouge du calendrier -->
  <rect x="10" y="16" width="44" height="10" rx="5" fill="#e53935"/>
  <rect x="10" y="22" width="44" height="4" fill="#e53935"/>
  <!-- Anneaux -->
  <rect x="18" y="10" width="4" height="12" rx="2" fill="#f9a825"/>
  <rect x="42" y="10" width="4" height="12" rx="2" fill="#f9a825"/>
  <!-- Chiffre/pastille BNI -->
  <circle cx="32" cy="40" r="10" fill="#f9a825"/>
  <text x="32" y="44.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#1a1a2e">BNI</text>
</svg>
